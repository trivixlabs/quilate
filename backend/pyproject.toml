[project]
name = "quilate"
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn[standard]", "apscheduler>=3,<4", "ccxt", "telethon", "anthropic",
  "pydantic>=2.14.3", "keyring", "httpx", "sqlite-vec", "sentence-transformers",
  "mlx-whisper", "yt-dlp", "trafilatura",
]

[project.scripts]
quilate = "quilate.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quilate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702"]
"quilate/ai/verdict.py" = ["E501"]  # prompts em linhas longas
